---
name: Bonds
version: "0.22.9-1"
slug: bonds
description: Personal relationship manager built with Go and React
url: https://github.com/mrwogu/hassio-addons/tree/main/bonds
image: ghcr.io/mrwogu/hassio-bonds
arch:
  - aarch64
  - amd64
init: false
startup: services
webui: http://[HOST]:[PORT:8080]
map:
  - type: addon_config
    read_only: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Bonds web interface
options:
  database: sqlite
  postgres_host: ""
  postgres_port: 5432
  postgres_db: bonds
  postgres_user: bonds
  postgres_password: ""
  postgres_sslmode: require
  app_url: http://homeassistant.local:8080
  jwt_secret: ""
  settings_encryption_key: ""
  storage_max_size_mb: 100
  backup_cron: "0 0 3 * * *"
  backup_retention_days: 30
  debug: false
schema:
  database: list(sqlite|postgres)
  postgres_host: str?
  postgres_port: int(1,65535)
  postgres_db: str
  postgres_user: str
  postgres_password: password?
  postgres_sslmode: list(disable|require|verify-full)
  app_url: str
  jwt_secret: password?
  settings_encryption_key: password?
  storage_max_size_mb: int(1,)
  backup_cron: str?
  backup_retention_days: int(1,)
  debug: bool
