---
configuration:
  database:
    name: Baza danych
    description: Użyj lokalnej bazy SQLite albo zewnętrznego PostgreSQL.
  postgres_host:
    name: Host PostgreSQL
    description: Nazwa hosta lub adres IP zewnętrznego serwera PostgreSQL.
  postgres_port:
    name: Port PostgreSQL
    description: Port serwera PostgreSQL.
  postgres_db:
    name: Baza PostgreSQL
    description: Nazwa bazy danych Bonds.
  postgres_user:
    name: Użytkownik PostgreSQL
    description: Użytkownik bazy danych używany przez Bonds.
  postgres_password:
    name: Hasło PostgreSQL
    description: Opcjonalne hasło użytkownika PostgreSQL.
  postgres_sslmode:
    name: Tryb TLS PostgreSQL
    description: >-
      disable wysyła dane uwierzytelniające jawnym tekstem, require szyfruje
      bez weryfikacji certyfikatu serwera, verify-full dodatkowo sprawdza
      certyfikat wobec zaufanych urzędów certyfikacji.
  app_url:
    name: Adres URL aplikacji
    description: Pełny adres URL dostępu do Bonds, wraz z portem bezpośrednim.
  jwt_secret:
    name: Sekret JWT
    description: Opcjonalny sekret podpisu. Pozostaw pusty, aby wygenerować i trwale zapisać go automatycznie.
  settings_encryption_key:
    name: Klucz szyfrowania ustawień
    description: Opcjonalny klucz szyfrowania. Pozostaw pusty, aby wygenerować i trwale zapisać go automatycznie.
  storage_max_size_mb:
    name: Maksymalny rozmiar wysyłanego pliku
    description: Maksymalny rozmiar wysyłanego pliku w megabajtach.
  backup_cron:
    name: Harmonogram kopii zapasowych
    description: >-
      Opcjonalne sześcioelementowe wyrażenie cron dla automatycznych kopii
      zapasowych. Dla zgodności akceptowane są też wyrażenia pięcioelementowe.
  backup_retention_days:
    name: Retencja kopii zapasowych
    description: Liczba dni przechowywania kopii zapasowych aplikacji.
  debug:
    name: Tryb debugowania
    description: Włącza szczegółową diagnostykę Bonds na potrzeby rozwiązywania problemów.
network:
  8080/tcp: Interfejs internetowy Bonds
