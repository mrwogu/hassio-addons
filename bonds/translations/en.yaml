---
configuration:
  database:
    name: Database
    description: Use local SQLite or an external PostgreSQL database.
  postgres_host:
    name: PostgreSQL host
    description: Hostname or IP address of the external PostgreSQL server.
  postgres_port:
    name: PostgreSQL port
    description: Port of the PostgreSQL server.
  postgres_db:
    name: PostgreSQL database
    description: Name of the Bonds database.
  postgres_user:
    name: PostgreSQL user
    description: Database user Bonds connects as.
  postgres_password:
    name: PostgreSQL password
    description: Optional password for the PostgreSQL user.
  postgres_sslmode:
    name: PostgreSQL TLS mode
    description: >-
      disable sends credentials in clear text, require encrypts without
      verifying the server certificate, verify-full also validates the
      certificate against the trusted certificate authorities.
  app_url:
    name: Application URL
    description: Full URL used to access Bonds, including the direct port.
  jwt_secret:
    name: JWT secret
    description: Optional signing secret. Leave blank to generate and persist one automatically.
  settings_encryption_key:
    name: Settings encryption key
    description: Optional encryption key. Leave blank to generate and persist one automatically.
  storage_max_size_mb:
    name: Maximum upload size
    description: Maximum uploaded file size in megabytes.
  backup_cron:
    name: Backup schedule
    description: Optional six-field cron expression for automatic backups. Five-field values are accepted for compatibility.
  backup_retention_days:
    name: Backup retention
    description: Number of days to retain application backups.
  debug:
    name: Debug mode
    description: Enable detailed Bonds diagnostics for troubleshooting.
network:
  8080/tcp: Bonds web interface
