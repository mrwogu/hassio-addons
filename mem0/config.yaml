---
name: Mem0
version: "2.0.19-4"
slug: mem0
description: Self-hosted AI memory layer with a REST API for AI assistants
url: https://github.com/mrwogu/hassio-addons/tree/main/mem0
image: ghcr.io/mrwogu/hassio-mem0
arch:
  - aarch64
  - amd64
init: false
startup: services
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Mem0 REST API
map:
  - type: addon_config
    read_only: false
options:
  openai_api_key: ""
  openai_base_url: ""
  anthropic_api_key: ""
  google_api_key: ""
  admin_api_key: ""
  jwt_secret: ""
  postgres_host: ""
  postgres_port: 5432
  postgres_db: mem0
  postgres_user: mem0
  postgres_password: ""
  postgres_collection_name: memories
  app_db_name: ""
  default_llm_model: gpt-5-mini
  default_embedder_model: text-embedding-3-small
  telemetry: false
  request_log_retention_days: 30
  env_vars: []
schema:
  openai_api_key: password
  openai_base_url: str?
  anthropic_api_key: password?
  google_api_key: password?
  admin_api_key: password?
  jwt_secret: password?
  postgres_host: str
  postgres_port: int(1,65535)
  postgres_db: str
  postgres_user: str
  postgres_password: password?
  postgres_collection_name: str
  app_db_name: str?
  default_llm_model: str
  default_embedder_model: str
  telemetry: bool
  request_log_retention_days: int(1,)
  env_vars:
    - name: str
      value: str
