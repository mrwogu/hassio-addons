---
configuration:
  openai_api_key:
    name: Klucz API OpenAI
    description: Wymagany klucz dla domyślnego modelu LLM i osadzania OpenAI.
  anthropic_api_key:
    name: Klucz API Anthropic
    description: Opcjonalny klucz wlaczajacy dostawce LLM Anthropic.
  google_api_key:
    name: Klucz API Google
    description: Opcjonalny klucz wlaczajacy dostawcow LLM i osadzania Gemini.
  admin_api_key:
    name: Klucz API administratora
    description: Starszy wspoldzielony klucz do chronionych punktow. Uzyj co najmniej 16 losowych znakow.
  jwt_secret:
    name: Sekret JWT
    description: Opcjonalny sekret do podpisywania tokenow. Puste pole generuje i zapisuje sekret automatycznie.
  postgres_host:
    name: Host PostgreSQL
    description: Adres zewnetrznego serwera PostgreSQL z rozszerzeniem pgvector.
  postgres_port:
    name: Port PostgreSQL
    description: Port serwera PostgreSQL.
  postgres_db:
    name: Baza danych PostgreSQL
    description: Baza przechowujaca kolekcje wektorow i tabele aplikacji.
  postgres_user:
    name: Uzytkownik PostgreSQL
    description: Uzytkownik bazy danych, ktorym laczy sie Mem0.
  postgres_password:
    name: Haslo PostgreSQL
    description: Opcjonalne haslo uzytkownika bazy danych.
  postgres_collection_name:
    name: Nazwa kolekcji wektorow
    description: Nazwa kolekcji pgvector przechowujacej wspomnienia.
  app_db_name:
    name: Nazwa bazy aplikacji
    description: Opcjonalna osobna baza dla uzytkownikow, kluczy API i dziennika zapytan. Puste pole uzywa bazy wektorow.
  default_llm_model:
    name: Domyslny model LLM
    description: Model uzywany dopoki nie zostanie nadpisany konfiguracja serwera.
  default_embedder_model:
    name: Domyslny model osadzania
    description: Model osadzania uzywany dopoki nie zostanie nadpisany konfiguracja serwera.
  telemetry:
    name: Anonimowa telemetria
    description: Wysyla pojedyncze anonimowe zdarzenie instalacji do Mem0. Domyslnie wylaczone.
  request_log_retention_days:
    name: Przechowywanie dziennika
    description: Liczba dni przechowywania historii dziennika zapytan.
network:
  8000/tcp: API REST Mem0
