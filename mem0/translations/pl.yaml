---
configuration:
  openai_api_key:
    name: Klucz API OpenAI
    description: Wymagany klucz dla domyślnego modelu LLM i osadzania OpenAI.
  openai_base_url:
    name: Bazowy adres URL OpenAI
    description: Opcjonalny własny endpoint dla usług zgodnych z OpenAI. Puste pole używa oficjalnego API.
  anthropic_api_key:
    name: Klucz API Anthropic
    description: Opcjonalny klucz włączający dostawcę LLM Anthropic.
  google_api_key:
    name: Klucz API Google
    description: Opcjonalny klucz włączający dostawców LLM i osadzania Gemini.
  admin_api_key:
    name: Klucz API administratora
    description: Starszy współdzielony klucz do chronionych punktów końcowych. Użyj co najmniej 16 losowych znaków.
  jwt_secret:
    name: Sekret JWT
    description: Opcjonalny sekret do podpisywania tokenów. Puste pole generuje i zapisuje sekret automatycznie.
  postgres_host:
    name: Host PostgreSQL
    description: Adres zewnętrznego serwera PostgreSQL z rozszerzeniem pgvector.
  postgres_port:
    name: Port PostgreSQL
    description: Port serwera PostgreSQL.
  postgres_db:
    name: Baza danych PostgreSQL
    description: Baza przechowująca kolekcję wektorów i tabele aplikacji.
  postgres_user:
    name: Użytkownik PostgreSQL
    description: Użytkownik bazy danych, którym łączy się Mem0.
  postgres_password:
    name: Hasło PostgreSQL
    description: Opcjonalne hasło użytkownika bazy danych.
  postgres_collection_name:
    name: Nazwa kolekcji wektorów
    description: Nazwa kolekcji pgvector przechowującej wspomnienia.
  app_db_name:
    name: Nazwa bazy aplikacji
    description: Opcjonalna osobna baza dla użytkowników, kluczy API i dziennika zapytań. Puste pole używa bazy wektorów.
  default_llm_model:
    name: Domyślny model LLM
    description: Model używany, dopóki nie zostanie nadpisany konfiguracją serwera.
  default_embedder_model:
    name: Domyślny model osadzania
    description: Model osadzania używany, dopóki nie zostanie nadpisany konfiguracją serwera.
  telemetry:
    name: Anonimowa telemetria
    description: Wysyła pojedyncze anonimowe zdarzenie instalacji do Mem0. Domyślnie wyłączone.
  request_log_retention_days:
    name: Przechowywanie dziennika
    description: Liczba dni przechowywania historii dziennika zapytań.
network:
  8000/tcp: API REST Mem0
