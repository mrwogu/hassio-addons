---
configuration:
  openai_api_key:
    name: OpenAI API key
    description: Required key for the default OpenAI LLM and embedder.
  openai_base_url:
    name: OpenAI base URL
    description: Optional custom endpoint for OpenAI-compatible services (LLM and embedder). Leave blank to use the official API.
  anthropic_api_key:
    name: Anthropic API key
    description: Optional key enabling the bundled Anthropic LLM provider.
  google_api_key:
    name: Google API key
    description: Optional key enabling the bundled Gemini LLM and embedder providers.
  admin_api_key:
    name: Admin API key
    description: Legacy shared key for protected endpoints. Use at least 16 random characters.
  jwt_secret:
    name: JWT secret
    description: Optional token-signing secret. Leave blank to generate and persist one automatically.
  postgres_host:
    name: PostgreSQL host
    description: Hostname of an external PostgreSQL server with the pgvector extension.
  postgres_port:
    name: PostgreSQL port
    description: Port of the PostgreSQL server.
  postgres_db:
    name: PostgreSQL database
    description: Database holding the vector collection and application tables.
  postgres_user:
    name: PostgreSQL user
    description: Database user Mem0 connects as.
  postgres_password:
    name: PostgreSQL password
    description: Optional password for the PostgreSQL user.
  postgres_collection_name:
    name: Vector collection name
    description: Name of the pgvector collection storing memories.
  app_db_name:
    name: Application database name
    description: Optional separate database for users, API keys, and request logs. Leave blank to reuse the vector database.
  default_llm_model:
    name: Default LLM model
    description: Model used unless overridden on the server configuration endpoint.
  default_embedder_model:
    name: Default embedder model
    description: Embedding model used unless overridden on the server configuration endpoint.
  telemetry:
    name: Anonymous telemetry
    description: Send a single anonymous onboarding event to Mem0. Disabled by default.
  request_log_retention_days:
    name: Request log retention
    description: Days of request log history to keep.
network:
  8000/tcp: Mem0 REST API
