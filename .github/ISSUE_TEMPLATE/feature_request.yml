---
name: Packaging feature
description: Suggest a Home Assistant adapter or repository automation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What packaging or Home Assistant problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the requested adapter or automation behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify affected add-ons, architectures, permissions, and release impact.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream context
      description: Add upstream links. Remove private data.
