---
name: Build changed add-ons

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed add-ons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      addons: ${{ steps.filter.outputs.addons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install manifest dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Select changed add-ons
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          all=$(python scripts/addon_manifest.py json)
          if [ "$EVENT" != "pull_request" ]; then
            echo "addons=$all" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          rebuild_all=false
          if printf '%s\n' "$changed" | grep -Eq \
            '^(\.github/workflows/(build-addon|build-addon-pr|build-pr)\.yml|addons\.yaml|scripts/(addon_manifest|validate_addons)\.py)$'
          then
            rebuild_all=true
          fi
          if [ "$rebuild_all" = true ]; then
            echo "addons=$all" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          addons='[]'
          manifest_addons=$(python scripts/addon_manifest.py list)
          while IFS= read -r addon; do
            if printf '%s\n' "$changed" | grep -q "^${addon}/"; then
              addons=$(jq -c --arg addon "$addon" '. + [$addon]' <<<"$addons")
            fi
          done <<<"$manifest_addons"
          echo "addons=$addons" >>"$GITHUB_OUTPUT"

  addon:
    name: Build ${{ matrix.addon }}
    needs: changes
    if: needs.changes.outputs.addons != '[]'
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
    uses: ./.github/workflows/build-addon-pr.yml
    with:
      addon: ${{ matrix.addon }}

  gate:
    name: Build gate
    needs:
      - changes
      - addon
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require build results
        env:
          CHANGES: ${{ needs.changes.result }}
          ADDON: ${{ needs.addon.result }}
        run: |
          set -eu
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection $CHANGES"
            exit 1
          fi
          case "$ADDON" in
            success | skipped)
              echo "Build gate passed (add-on build: $ADDON)"
              ;;
            *)
              echo "::error::Add-on build $ADDON"
              exit 1
              ;;
          esac
