---
name: Traefik integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traefik-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Traefik ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --load --platform "$PLATFORM" \
            --tag "local/traefik-proxy:integration-$ARCH" traefik-proxy

      - name: Load AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-utils
          sed 's/profile ADDON_SLUG/profile mrwogu-traefik-proxy-${{ matrix.arch }}/' \
            traefik-proxy/apparmor.txt >integration-apparmor.txt
          sudo apparmor_parser --replace integration-apparmor.txt

      - name: Run integration
        env:
          ACME_TEST: "true"
          APPARMOR_PROFILE: mrwogu-traefik-proxy-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          CONTAINER: traefik-proxy-integration-${{ github.run_id }}-${{ matrix.arch }}
          IMAGE: local/traefik-proxy:integration-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: sh traefik-proxy/tests/integration.sh

      - name: Inspect failure
        if: failure()
        run: docker ps -a

      - name: Clean up
        if: always()
        run: |
          docker rm --force "traefik-proxy-integration-${GITHUB_RUN_ID}-${{ matrix.arch }}" \
            >/dev/null 2>&1 || true
          sudo apparmor_parser --remove integration-apparmor.txt \
            >/dev/null 2>&1 || true
          rm -f integration-apparmor.txt
