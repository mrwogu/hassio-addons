---
name: Synchronize Renovate metadata

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: renovate-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize add-on metadata
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'renovate/')
      && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Check out Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: worktree
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install sync dependencies
        run: python -m pip install -r base/requirements-dev.txt

      - name: Synchronize changed add-ons
        working-directory: worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          manifest_addons=$(python3 ../base/scripts/addon_manifest.py list)
          while IFS= read -r addon; do
            if git diff --name-only "$BASE_SHA...HEAD" -- "${addon}/Dockerfile" |
              grep -qx "${addon}/Dockerfile"
            then
              metadata_changed_in_pr=false
              for relative in config.yaml upstream.yaml CHANGELOG.md; do
                if ! git diff --quiet "$BASE_SHA...HEAD" -- "$addon/$relative"; then
                  metadata_changed_in_pr=true
                fi
              done
              if [ "$addon" = "n8n" ]; then
                python3 ../base/scripts/sync_n8n_apk_checksum.py --root "$PWD"
              fi
              python3 ../base/scripts/sync_addon_version.py "$addon"
              metadata_changed=false
              if ! git diff --quiet -- \
                "$addon/config.yaml" "$addon/upstream.yaml"
              then
                metadata_changed=true
              fi
              if [ "$metadata_changed_in_pr" = false ] &&
                [ "$metadata_changed" = false ]
              then
                python3 ../base/scripts/bump_addon_revision.py "$addon" \
                  --message "Refresh packaging dependency"
              fi
            fi
          done <<<"$manifest_addons"

      - name: Commit synchronized metadata
        id: commit
        working-directory: worktree
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          if git diff --quiet; then
            echo "No metadata changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          manifest_addons=$(python3 ../base/scripts/addon_manifest.py list)
          while IFS= read -r addon; do
            git add -- \
              "$addon/Dockerfile" "$addon/config.yaml" \
              "$addon/upstream.yaml" "$addon/CHANGELOG.md"
          done <<<"$manifest_addons"
          git commit -m "chore(deps): synchronize add-on metadata"
          echo "head_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          git push origin "HEAD:${BRANCH}"

      - name: Approve checks for synchronized commit
        if: steps.commit.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          for _ in $(seq 1 180); do
            run_ids=$(
              gh api \
                "repos/$REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
                --jq '.workflow_runs[] |
                  select(
                    .name == "Lint" or
                    .name == "Test" or
                    .name == "Build changed add-ons"
                  ) | .id'
            )
            run_count=$(printf '%s\n' "$run_ids" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$run_count" -lt 3 ]; then
              sleep 10
              continue
            fi
            pending=false
            for run_id in $run_ids; do
              conclusion=$(
                gh api "repos/$REPOSITORY/actions/runs/$run_id" \
                  --jq '.conclusion // empty'
              )
              if [ "$conclusion" = "action_required" ]; then
                gh api --method POST \
                  "repos/$REPOSITORY/actions/runs/$run_id/approve" >/dev/null
                pending=true
              elif [ -z "$conclusion" ]; then
                pending=true
              elif [ "$conclusion" != "success" ]; then
                echo "::error::Required workflow $run_id concluded $conclusion"
                exit 1
              fi
            done
            if [ "$pending" = false ]; then
              exit 0
            fi
          done
          echo "::error::Timed out waiting for Renovate checks after 30 minutes"
          exit 1
