---
name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validators
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository checks
        run: make check

      - name: Validate YAML
        run: yamllint .

      - name: Validate shell
        run: |
          find . -type f -not -path './.git/*' -not -path './.github/*' \
            \( -name '*.sh' -o -name 'addon-entrypoint' \) \
            -print0 | xargs -0 shellcheck

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  changes:
    name: Detect unreleased add-ons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      all_addons: ${{ steps.filter.outputs.all_addons }}
      addons: ${{ steps.filter.outputs.addons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install manifest dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Select unreleased add-ons
        id: filter
        run: |
          set -eu
          addons='[]'
          all_addons=$(python3 scripts/addon_manifest.py json)
          echo "all_addons=$all_addons" >>"$GITHUB_OUTPUT"
          manifest_addons=$(python3 scripts/addon_manifest.py list)
          while IFS= read -r addon; do
            version=$(sed -n 's/^version: "\(.*\)"$/\1/p' "$addon/config.yaml")
            if [ -z "$version" ]; then
              echo "::error::Could not read $addon version"
              exit 1
            fi
            tag="$addon/$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" \
              >/dev/null 2>&1
            then
              continue
            else
              status=$?
            fi
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not verify release tag $tag"
              exit 1
            fi
            addons=$(jq -c --arg addon "$addon" '. + [$addon]' <<<"$addons")
          done <<<"$manifest_addons"
          echo "addons=$addons" >>"$GITHUB_OUTPUT"

  addon-lint:
    name: Validate ${{ matrix.addon }} metadata
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.all_addons) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21
        with:
          path: ./${{ matrix.addon }}

  addon:
    name: ${{ matrix.addon }}
    needs:
      - changes
      - validate
      - addon-lint
    if: >-
      github.repository == 'mrwogu/hassio-addons'
      && needs.changes.outputs.addons != '[]'
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
    uses: ./.github/workflows/build-addon.yml
    with:
      addon: ${{ matrix.addon }}
      publish: true
