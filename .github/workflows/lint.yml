---
name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validators
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository
        run: python scripts/validate_addons.py

      - name: Validate Dockerfile synchronization
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_dockerfile_sync.py "$BASE" "$GITHUB_SHA"

      - name: Validate YAML
        run: yamllint .

      - name: Validate PromptScript
        run: |
          npx --yes @promptscript/cli@1.18.1 check
          npx --yes @promptscript/cli@1.18.1 validate --strict
          npx --yes @promptscript/cli@1.18.1 compile
          git diff --exit-code -- \
            AGENTS.md CLAUDE.md \
            .claude/workflows .claude/skills/promptscript/SKILL.md \
            .factory/skills/promptscript/SKILL.md
          test -z "$(git status --short --untracked-files=all -- \
            AGENTS.md CLAUDE.md \
            .claude/workflows .claude/skills/promptscript/SKILL.md \
            .factory/skills/promptscript/SKILL.md)"

      - name: Validate shell
        run: |
          find . -type f -not -path './.git/*' -not -path './.github/*' \
            \( -name '*.sh' -o -name 'addon-entrypoint' \) \
            -print0 | xargs -0 shellcheck

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  changes:
    name: Detect changed add-ons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      addons: ${{ steps.filter.outputs.addons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install manifest dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Select changed add-ons
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(python3 scripts/addon_manifest.py json)
          # Lint every add-on on pushes to main and when this workflow changes;
          # otherwise only the add-ons touched by the pull request.
          if [ "$EVENT" != "pull_request" ]; then
            echo "addons=$all" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if printf '%s\n' "$changed" | grep -Eq \
            '^(\.github/workflows/lint\.yml|addons\.yaml|scripts/(addon_manifest|validate_addons)\.py)$'
          then
            echo "addons=$all" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          addons='[]'
          manifest_addons=$(python3 scripts/addon_manifest.py list)
          while IFS= read -r addon; do
            if printf '%s\n' "$changed" | grep -q "^${addon}/"; then
              addons=$(jq -c --arg addon "$addon" '. + [$addon]' <<<"$addons")
            fi
          done <<<"$manifest_addons"
          echo "addons=$addons" >>"$GITHUB_OUTPUT"

  addon:
    name: Add-on ${{ matrix.addon }}
    needs: changes
    if: needs.changes.outputs.addons != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21
        with:
          path: ./${{ matrix.addon }}

  gate:
    name: Lint gate
    needs:
      - repository
      - changes
      - addon
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint results
        env:
          REPOSITORY: ${{ needs.repository.result }}
          CHANGES: ${{ needs.changes.result }}
          ADDON: ${{ needs.addon.result }}
        run: |
          # Stable required check for branch protection: the per-add-on linter
          # may be skipped when nothing relevant changed.
          if [ "$REPOSITORY" != "success" ]; then
            echo "::error::Repository checks $REPOSITORY"
            exit 1
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection $CHANGES"
            exit 1
          fi
          case "$ADDON" in
            success | skipped)
              echo "Lint gate passed (add-on linter: $ADDON)"
              ;;
            *)
              echo "::error::Add-on linter $ADDON"
              exit 1
              ;;
          esac
