---
configuration:
  log_level:
    name: Log level
    description: Verbosity of the FlareSolverr log.
  log_html:
    name: Log HTML
    description: Write full page HTML to the log. Very verbose, use only for debugging.
  disable_media:
    name: Disable media
    description: Block images, CSS and fonts in the browser to save bandwidth and CPU.
  env_vars:
    name: Advanced environment variables
    description: Extra upstream variables with uppercase names, for example PROXY_URL.
network:
  8191/tcp: FlareSolverr HTTP API (no authentication)
