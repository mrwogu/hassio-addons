---
configuration:
  log_level:
    name: Poziom logu
    description: Szczegółowość logu FlareSolverr.
  log_html:
    name: Loguj HTML
    description: Zapisuje pełny HTML stron w logu. Bardzo gadatliwe, tylko do debugowania.
  disable_media:
    name: Wyłącz media
    description: Blokuje obrazy, CSS i czcionki w przeglądarce, żeby oszczędzić transfer i CPU.
  env_vars:
    name: Zaawansowane zmienne środowiskowe
    description: Dodatkowe zmienne upstream z nazwami wielkimi literami, na przykład PROXY_URL.
network:
  8191/tcp: API HTTP FlareSolverr (bez uwierzytelniania)
