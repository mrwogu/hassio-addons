---
name: FlareSolverr
version: "3.5.2-1"
slug: flaresolverr
description: Proxy server that solves Cloudflare challenges for Prowlarr and others
url: https://github.com/mrwogu/hassio-addons/tree/main/flaresolverr
image: ghcr.io/mrwogu/hassio-flaresolverr
arch:
  - aarch64
  - amd64
init: false
startup: services
map:
  - type: app_config
    read_only: false
ports:
  8191/tcp: 8191
ports_description:
  8191/tcp: FlareSolverr HTTP API (no authentication)
options:
  log_level: info
  log_html: false
  disable_media: false
  env_vars: []
schema:
  log_level: list(debug|info)
  log_html: bool
  disable_media: bool
  env_vars:
    - name: str
      value: str
