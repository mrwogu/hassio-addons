---
name: Ghostfolio
version: "3.93.0-1"
slug: ghostfolio
description: Open source wealth management software for tracking stocks, ETFs, and cryptocurrencies
url: https://github.com/mrwogu/hassio-addons/tree/main/ghostfolio
image: ghcr.io/mrwogu/hassio-ghostfolio
arch:
  - aarch64
  - amd64
init: false
startup: services
webui: http://[HOST]:[PORT:3333]
map:
  - type: app_config
    read_only: false
ports:
  3333/tcp: 3333
ports_description:
  3333/tcp: Ghostfolio web interface
options:
  postgres_host: ""
  postgres_port: 5432
  postgres_db: ghostfolio
  postgres_user: ghostfolio
  postgres_password: ""
  postgres_sslmode: prefer
  redis_host: ""
  redis_port: 6379
  redis_db: 0
  redis_password: ""
  redis_tls: false
  access_token_salt: ""
  jwt_secret_key: ""
  root_url: ""
  log_level: log
  enable_auth_token: true
  enable_security_headers: false
  enable_mcp: false
  api_key_coingecko_demo: ""
  api_key_coingecko_pro: ""
  oidc_enabled: false
  oidc_issuer: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  env_vars: []
schema:
  postgres_host: str
  postgres_port: int(1,65535)
  postgres_db: str
  postgres_user: str
  postgres_password: password
  postgres_sslmode: list(disable|prefer|require)
  redis_host: str
  redis_port: int(1,65535)
  redis_db: int(0,15)
  redis_password: password?
  redis_tls: bool
  access_token_salt: password?
  jwt_secret_key: password?
  root_url: url?
  log_level: list(error|warn|log|debug|verbose)
  enable_auth_token: bool
  enable_security_headers: bool
  enable_mcp: bool
  api_key_coingecko_demo: password?
  api_key_coingecko_pro: password?
  oidc_enabled: bool
  oidc_issuer: url?
  oidc_client_id: str?
  oidc_client_secret: password?
  env_vars:
    - name: str
      value: str
