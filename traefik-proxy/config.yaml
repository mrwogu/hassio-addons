---
name: Traefik Proxy
version: "3.7.16-8"
slug: traefik-proxy
description: Secure file-configured reverse proxy for Home Assistant
url: https://github.com/mrwogu/hassio-addons/tree/main/traefik-proxy
image: ghcr.io/mrwogu/hassio-traefik-proxy
arch:
  - aarch64
  - amd64
init: false
startup: services
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
ports:
  80/tcp: 80
  443/tcp: 443
ports_description:
  80/tcp: HTTP reverse proxy
  443/tcp: HTTPS reverse proxy
options:
  log_level: info
  access_log_format: json
  access_log_headers: []
  read_timeout: 60s
  metrics_enabled: false
  log_max_size: 50M
  log_keep: 14
  log_max_age: 0
  trusted_proxy_ips: []
  acme:
    enabled: false
    email: ""
    cloudflare_api_token: ""
    cloudflare_api_token_file: ""
schema:
  log_level: list(error|warn|info|debug)
  access_log_format: list(json|common)
  access_log_headers:
    - str
  read_timeout: str?
  metrics_enabled: bool?
  log_max_size: match(^[1-9][0-9]{0,5}[kMG]$)?
  log_keep: int(1,365)?
  log_max_age: int(0,3650)?
  trusted_proxy_ips:
    - str
  acme:
    enabled: bool
    email: str?
    cloudflare_api_token: password?
    cloudflare_api_token_file: str?
