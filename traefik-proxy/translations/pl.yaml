---
configuration:
  log_level:
    name: Poziom logu aplikacji
    description: Szczegółowość logu aplikacji Traefik.
  access_log_format:
    name: Format access logu
    description: JSON Lines do analizy albo Common Log Format dla prostych filtrów.
  access_log_headers:
    name: Dodatkowe nagłówki w access logu
    description: Nagłówki żądania zapisywane w access logu JSON, np. X-Authentik-Username. Bez nagłówków z danymi logowania.
  read_timeout:
    name: Limit czasu odczytu requestu
    description: Czas na odczyt całego requestu z body, np. 60s, 10m, 0s bez limitu. Zwiększ przy dużych uploadach.
  metrics_enabled:
    name: Metryki Prometheus
    description: Metryki na porcie 8083 dla innych aplikacji w sieci Supervisora. Bez uwierzytelniania, nie na hoście.
  log_max_size:
    name: Rozmiar rotacji logów
    description: Rotuj plik logu po przekroczeniu tego rozmiaru, np. 50M, 1G. Sprawdzane co 5 minut.
  log_keep:
    name: Liczba starych logów
    description: Ile skompresowanych starych plików trzymać dla każdego logu. Starsze są usuwane.
  log_max_age:
    name: Maksymalny wiek logów w dniach
    description: Usuwaj też stare logi starsze niż tyle dni. 0 to tylko limit liczby plików.
  trusted_proxy_ips:
    name: Zaufane zakresy proxy
    description: Tylko zakresy CIDR lokalnego cloudflared albo zaufanego proxy.
  acme:
    name: Let's Encrypt DNS-01
    description: Opcjonalny resolver certyfikatów z ograniczonym tokenem Cloudflare DNS.
    fields:
      enabled:
        name: Włącz ACME
        description: Pobieraj certyfikaty przez wyzwanie Cloudflare DNS-01.
      email:
        name: Email konta ACME
        description: Adres używany przy rejestracji w Let's Encrypt.
      cloudflare_api_token:
        name: Token API Cloudflare
        description: Ograniczony token edycji DNS. Nie trafia do logów Traefik.
      cloudflare_api_token_file:
        name: Plik tokenu API Cloudflare
        description: Absolutna ścieżka pod /config albo /share/traefik do chronionego pliku tokenu.
network:
  80/tcp: Proxy reverse HTTP
  443/tcp: Proxy reverse HTTPS
