---
configuration:
  log_level:
    name: Application log level
    description: Traefik application log verbosity.
  access_log_format:
    name: Access log format
    description: JSON Lines for analysis or Common Log Format for simple filters.
  access_log_headers:
    name: Extra access log headers
    description: Request header names to keep in the JSON access log, e.g. X-Authentik-Username. Never list credential headers.
  read_timeout:
    name: Request read timeout
    description: Time to read a whole request, body included, e.g. 60s, 10m, 0s for no limit. Raise it for big uploads.
  metrics_enabled:
    name: Prometheus metrics
    description: Metrics on port 8083 for other apps in the Supervisor network. No authentication, not published on the host.
  log_max_size:
    name: Log rotation size
    description: Rotate a log file when it is bigger than this, e.g. 50M, 1G. Checked every 5 minutes.
  log_keep:
    name: Rotated logs to keep
    description: How many compressed old files to keep for each log. Older ones are deleted.
  log_max_age:
    name: Log max age in days
    description: Also delete rotated logs older than this many days. 0 means keep by count only.
  trusted_proxy_ips:
    name: Trusted proxy IP ranges
    description: CIDR ranges of the local cloudflared or reverse proxy source only.
  acme:
    name: Let's Encrypt DNS-01
    description: Optional certificate resolver using a scoped Cloudflare DNS token.
    fields:
      enabled:
        name: Enable ACME
        description: Obtain certificates through the Cloudflare DNS-01 challenge.
      email:
        name: ACME account email
        description: Email address used for Let's Encrypt registration.
      cloudflare_api_token:
        name: Cloudflare API token
        description: Scoped DNS edit token. It is never written to Traefik logs.
      cloudflare_api_token_file:
        name: Cloudflare API token file
        description: Absolute path under /config or /share/traefik to a protected token file.
network:
  80/tcp: HTTP reverse proxy
  443/tcp: HTTPS reverse proxy
